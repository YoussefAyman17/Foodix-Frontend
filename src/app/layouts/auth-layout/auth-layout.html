<!-- Simple Auth Navbar -->
<div class="auth-layout-container">
  <nav
    class="navbar navbar-expand-lg sticky-top"
    style="background-color: rgb(0, 0, 0); height: 90px; font-family: sans-serif"
  >
    <div class="container d-flex align-items-center h-100">
      <!-- Logo -->
      <a class="navbar-brand" routerLink="/home" routerLinkActive="active-link">
        <img src="/Assets/Logo/logo-white.png" alt="logo" />
      </a>

      <!-- Desktop Nav Links -->
      <div class="d-none d-lg-flex align-items-center gap-3 ms-auto">
        <ul class="navbar-nav fs-5 fw-bold flex-row gap-3 nav-links">
          <li class="nav-item">
            <a
              class="nav-link text-light"
              routerLink="/"
              routerLinkActive="active-link"
              [routerLinkActiveOptions]="{ exact: true }"
              >Home</a
            >
          </li>
          <li class="nav-item">
            <a class="nav-link text-light" routerLink="/signUp" routerLinkActive="active-link"
              >Sign Up</a
            >
          </li>
          <li class="nav-item">
            <a class="nav-link text-light" routerLink="/login" routerLinkActive="active-link"
              >Login</a
            >
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="auth-content">
    <router-outlet></router-outlet>
  </main>
</div>
